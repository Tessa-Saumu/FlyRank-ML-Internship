name: Personal capstone evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r work/requirements-evidence.txt
      - run: python work/scripts/verify_evidence.py
